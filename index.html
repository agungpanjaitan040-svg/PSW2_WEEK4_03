<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pendaftaran Kegiatan</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main>
      <h1>Pendaftaran Kegiatan</h1>
      <p class="notice">Kolom bertanda wajib harus diisi.</p>
      <form class="card" action="#" method="get">

        <label for="nama">Nama lengkap (wajib)</label>
        <input id="nama" name="nama" autocomplete="name" required />

        <label for="email">Email (wajib)</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required />
      
        
      
        <label for="telepon">telepon (wajib)</label>
        <input id="telepon" name="telepon" type="tel" required />
   

        <label for="ticket">Jumlah Tiket</label>
        <input id="ticket" name="ticket" type="number" required />
        

      
        <label for="prodi">Program studi (wajib)</label>
        <select id="prodi" name="prodi" required>
          <option value="">Pilih program studi</option>
          <option value="trpl">D4 TRPL</option>
          <option value="ti">D3 Teknologi Informasi</option>
          
        </select>
        <fieldset>
          <legend>Mode kehadiran (wajib)</legend>
          <input id="luring" name="mode" type="radio" value="luring" required />
          <label for="luring">Luring</label>
          <input id="daring" name="mode" type="radio" value="daring" />
          <label for="daring">Daring</label>
        </fieldset>
        <fieldset>
          <legend>Minat Topik</legend>
          <input id="html" name="mode" type="checkbox" value="html" required />
          <label for="html">HTML</label>
          <input id="css" name="mode" type="checkbox" value="css" />
          <label for="css">CSS</label>
        </fieldset>
        <fieldset>
          <legend>Aksesibilitas</legend>
          <input
            id="tuli"
            name="pembantu"
            type="checkbox"
            value="tuli"
            required
          />
          <label for="tuli">Pembantu baca</label>
          <input id="buta" name="mode" type="checkbox" value="buta" />
          <label for="buta">Text to speech</label>
        </fieldset>
        <label for="catatan">Catatan (opsional)</label>
        <textarea
          id="catatan"
          name="catatan"
          rows="4"
          maxlength="300"
        ></textarea>
        <button type="submit">Daftar</button>
      </form>
    </main>
  </body>
</html>
